<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор юнит-экономики</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="logo">
    <h1>Калькулятор юнит-экономики</h1>
    </header>
    <main class="content">
        
            <form id="unit-economics-form">
                <div class="form-group">
                <label for="price">Цена (₽)</label>
                <input 
                    type="number" 
                    id="price" 
                    name="price" 
                    step="any" 
                    min="0" 
                    required 
                    placeholder="Например, 99">
                </div>  
                 <div class="form-group">
                <label for="cogs">Переменные затраты на пользователя (₽)</label>
                <input 
                    type="number" 
                    id="cogs" 
                    name="cogs" 
                    step="any" 
                    min="0" 
                    required 
                    placeholder="Например, 5">
                </div>

                <div class="form-group">
                    <label for="churn">Месячный отток (%)</label>
                    <input 
                        type="number" 
                        id="churn" 
                        name="churn" 
                        step="any" 
                        min="0" 
                        max="100" 
                        required 
                        placeholder="Например, 50">
                </div>

                <div class="form-group">
                    <label for="cac">Стоимость привлечения (₽)</label>
                    <input 
                        type="number" 
                        id="cac" 
                        name="cac" 
                        step="any" 
                        min="0" 
                        required 
                        placeholder="Например, 20">
                </div>

                <div class="form-group">
                    <label for="conversion">Конверсия в платящего (%)</label>
                    <input 
                        type="number" 
                        id="conversion" 
                        name="conversion" 
                        step="any" 
                        min="0" 
                        max="100" 
                        required 
                        placeholder="Например, 2">
                </div>

                <button type="submit">Рассчитать</button>
            </form>
    
                <div id="results" style="display: none;">
                
                </div>
        </main>

    <script src="../js/script.js"></script>

</body>
</html>
